services:
  mongo:
    # Pinned to 4.4: mongo 5+ requires a CPU with AVX support, which some
    # deployment targets (e.g. older Synology/Atom NAS boxes) don't have.
    image: mongo:4.4
    container_name: carrera-mongo
    restart: unless-stopped
    ports:
      # Expuesto en la red (no solo loopback) a pedido, para conectarse
      # directo a 172.24.160.6:27017. Sin usuario/contraseña configurados:
      # queda accesible sin autenticación a cualquiera en la red.
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: carrera-redis
    restart: unless-stopped
    ports:
      # Host port moved to 6380: some hosts already run a native redis-server
      # on 6379, which would otherwise collide with this container's mapping.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data

  server:
    build: ./server
    container_name: carrera-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: carrera_informatico_2026
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: 1
    depends_on:
      - mongo
      - redis
    networks:
      - default
      - rfid-net

  worker:
    build: ./server
    container_name: carrera-worker
    restart: unless-stopped
    command: python worker.py
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: carrera_informatico_2026
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: 1
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
  redis_data:

networks:
  # Red compartida con el stack de cliente-administrador-RFID: le permite a
  # Nginx, en cada uno de esos contenedores, hacer proxy_pass hacia este
  # backend por su container_name ("carrera-server") sin depender de
  # ninguna IP de LAN o Tailscale. Se crea una sola vez con
  # `docker network create rfid-net` (o la crean los deploy.sh de ambos
  # repos si no existe).
  rfid-net:
    external: true
